# ===========================================
# PrepWise - Docker Compose
# Multi-service orchestration for production
# ===========================================

services:
  # ─── Next.js Application ─────────────────────────────────────────────────────
  nextjs-app:
    container_name: prepwise-nextjs
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NODE_ENV: production
    ports:
      - "${NEXTJS_PORT:-3000}:3000"
    environment:
      # Supabase Configuration
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # VideoSDK Configuration
      - VIDEOSDK_API_KEY=${VIDEOSDK_API_KEY}
      - VIDEOSDK_SECRET_KEY=${VIDEOSDK_SECRET_KEY}
      - NEXT_PUBLIC_VIDEOSDK_API_KEY=${NEXT_PUBLIC_VIDEOSDK_API_KEY}
      - NEXT_PUBLIC_VIDEOSDK_TOKEN=${NEXT_PUBLIC_VIDEOSDK_TOKEN}
      # Agent Configuration
      - AI_AGENT_URL=http://python-agent:8000
      # Node Environment
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      python-agent:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - prepwise-network
    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ─── Python AI Agent ─────────────────────────────────────────────────────────
  python-agent:
    container_name: prepwise-agent
    build:
      context: .
      dockerfile: Dockerfile.agent
      target: runner
    ports:
      - "${AGENT_PORT:-8000}:8000"
    environment:
      # Google AI Configuration
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      # VideoSDK Configuration
      - VIDEOSDK_API_KEY=${VIDEOSDK_API_KEY}
      - VIDEOSDK_SECRET_KEY=${VIDEOSDK_SECRET_KEY}
      - NEXT_PUBLIC_VIDEOSDK_ROOM_ID=${NEXT_PUBLIC_VIDEOSDK_ROOM_ID}
      - NEXT_PUBLIC_VIDEOSDK_TOKEN=${NEXT_PUBLIC_VIDEOSDK_TOKEN}
      # Python Environment
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - prepwise-network
    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    # Volume for logs (optional)
    volumes:
      - agent-logs:/app/logs

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  prepwise-network:
    driver: bridge
    name: prepwise-network

# ─── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  agent-logs:
    name: prepwise-agent-logs
