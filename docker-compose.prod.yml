# Production docker-compose: no bind mounts, resource limits, restart policies
version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: interview-mongo-prod
    environment:
      MONGO_INITDB_DATABASE: ai-mock-interview
    restart: unless-stopped
    volumes:
      - mongo_data_prod:/data/db
    networks:
      - interview-network-prod
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 1G

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: interview-backend:latest
    container_name: interview-backend-prod
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      MONGODB_URL: mongodb://mongo:27017/ai-mock-interview
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - interview-network-prod
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 1G

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.interviewiq.ai
    image: interview-frontend:latest
    container_name: interview-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - interview-network-prod
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  mongo_data_prod:

networks:
  interview-network-prod:
    driver: bridge
